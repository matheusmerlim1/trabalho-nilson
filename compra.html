<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Compra - DLM Market</title>
    <link rel="stylesheet" href="./style/style.css">
<script type="module" src="compra.js" defer></script></body>

</head>
<body>
    <header>
        <div class="logo"><a href="index.html">DLM Market</a></div>
    </header>
    <main>
    <div class="form-card">
        <h1>Finalizar Compra</h1>
        
        <div id="info-livro">
            <p>Carregando dados do livro...</p>
        </div>

        <form id="formCompra">
            <label>Forma de Pagamento</label>
            <select id="metodoPagamento">
                <option>Cartão de Crédito</option>
                <option>PIX</option>
                <option>Token DLM (Blockchain)</option>
            </select>
            
            <input type="text" placeholder="Dados do Pagamento (Simulado)" required>
            
            <button type="submit" id="btnConfirmarCompra" class="btn-primary">Confirmar e Pagar</button>
        </form>
    </div>
</main>

</html>
