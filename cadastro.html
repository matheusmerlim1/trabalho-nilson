<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - DLM Market</title>
    <link rel="stylesheet" href="./style/style.css">
    <script src="./cadastro.js" type="module" defer></script>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">DLM Market</a></div>
    </header>
    <main>
        <div class="form-card">
            <h1>Criar Conta</h1>
            <form id="formCadastro">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
                
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
                
                <label>Data de Nascimento</label>
                <input type="date" id="dataNasc" required>

                <label>Senha</label>
                <input type="password" id="senha" required>

                <label>Confirmar Senha</label>
                <input type="password" id="confirmarSenha" required>
                
                <label>Token (Opcional)</label>
                <input type="text" id="tokenManual" placeholder="Gerado automaticamente">

                <button type="submit" class="btn-primary">Finalizar Cadastro</button>
            </form>
        </div>
    </main>
</body>
</html>
