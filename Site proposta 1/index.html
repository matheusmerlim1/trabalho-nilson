<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLM Market - Home</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none; color:white;">DLM Market</a></div>
        <nav id="nav-user">
            <button id="btnOpenLogin">Login</button>
        </nav>
    </header>

    <main>
        <h1>Livros Disponíveis</h1>

        <div class="search-container" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; background: #f4f4f4; padding: 15px; border-radius: 8px;">
            <input type="text" id="searchNome" placeholder="Pesquisar por título...">
            <input type="text" id="searchAutor" placeholder="Pesquisar por autor...">
            <input type="number" id="searchPreco" placeholder="Preço máximo (R$)">
            <button id="btnSearch" class="btn-primary" style="padding: 5px 15px;">Pesquisar</button>
            <button id="btnClearSearch" style="padding: 5px 10px; cursor: pointer;">Limpar</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome do Livro</th>
                        <th>Autor</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-livros">
                    </tbody>
            </table>
        </div>
    </main>

    <dialog id="loginDialog">
        <form id="formLogin" method="dialog">
            <h2>Login</h2>
            <label for="userLogin">CPF</label>
            <input type="text" id="userLogin" placeholder="Digite seu CPF" required>
            <label for="passLogin">Senha</label>
            <input type="password" id="passLogin" placeholder="Sua Senha" required>
            <div class="actions">
                <button type="submit" class="btn-primary">Entrar</button>
                <button type="button" onclick="window.location.href='cadastro.html'">Cadastrar</button>
            </div>
            <p style="margin-top: 15px; text-align: center;">
                <a href="recupera.html" style="color: var(--accent); text-decoration: none; font-size: 14px;">Esqueci minha senha</a>
            </p>
            <button type="button" id="btnCloseLogin" class="btn-close">Fechar</button>
        </form>
    </dialog>

    <script type="module" src="index.js"></script>
</body>
</html>
