<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - DLM Market</title>
    <link rel="stylesheet" href="./style/style.css">
    <script src="./usuario.js" type="module" defer></script>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: white;">DLM Market</a></div>
        <span id="nome-usuario" style="font-weight: bold;">Olá, Usuário</span>
    </header>

    <main>
        <section>
            <h2>Vender Novo Livro (Anunciar)</h2>
            <div class="form-card">
                <form id="form-venda">
                    <label for="nome-livro">Título do Livro</label>
                    <input type="text" id="nome-livro" placeholder="Ex: Gestão de Direitos Digitais" required>
                    
                    <label for="valor-livro">Preço de Venda (R$)</label>
                    <input type="number" id="valor-livro" step="0.01" placeholder="0.00" required>
                    
                    <label for="arquivo-pdf">Selecionar Arquivo PDF (deve estar na pasta /livro)</label>
                    <input type="file" id="arquivo-pdf" accept=".pdf" required>
                    
                    <button type="submit" class="btn-primary">Anunciar para Venda</button>
                </form>
            </div>
        </section>

        <section style="margin-top: 40px;">
            <h2>Meus Livros à Venda (Como Autor)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Preço</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-vendas"></tbody>
                </table>
            </div>
        </section>

        <section style="margin-top: 40px; margin-bottom: 50px;">
            <h2>Minha Biblioteca (Livros Comprados)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Ação</th>
                            <th>Revenda</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-biblioteca"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; color: #888;">
        &copy; 2026 DLM Market - Gestão de Direitos Digitais
    </footer>
</body>
</html>
